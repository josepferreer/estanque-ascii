<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131c">
  <title>Estanque</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header id="hud">
      <span id="zoneName"></span>
      <span id="stats"><span id="perlas"></span><span id="food"></span></span>
    </header>

    <div id="stage">
      <canvas id="pond"></canvas>
      <div id="toast" aria-live="polite"></div>
    </div>

    <p id="info"></p>

    <nav id="nav">
      <button data-p="map">mapa</button>
      <button data-p="album">álbum</button>
      <button data-p="egg">huevo</button>
    </nav>
  </main>

  <section id="panel" hidden>
    <div id="sheet">
      <button id="close" aria-label="Cerrar">×</button>
      <div id="body"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
